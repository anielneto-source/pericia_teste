services:
  - type: web
    name: pericia-teste
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data/pericia
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: pericia-documentos
      mountPath: /var/data
      sizeGB: 1
